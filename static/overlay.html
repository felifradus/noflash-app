<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NoFlash HUD</title>
  <style>
    :root {
      --bg: rgba(7, 13, 22, 0.86);
      --border: rgba(200, 170, 110, 0.34);
      --gold: #c8aa6e;
      --gold-bright: #f0e6d2;
      --cyan: #0ac8b9;
      --red: #ff4e50;
      --green: #38e59d;
      --text: #e6edf3;
      --muted: #8b9bb0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070d16;
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .hud-shell {
      width: 100%;
      height: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Ultra-slim draggable header (26px) */
    .hud-bar {
      height: 26px;
      min-height: 26px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      background: linear-gradient(90deg, rgba(16, 28, 46, 0.96), rgba(9, 17, 29, 0.96));
      border-bottom: 1px solid rgba(200, 170, 110, 0.22);
      cursor: move;
    }

    .hud-brand {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: var(--gold);
      white-space: nowrap;
      overflow: hidden;
    }

    .hud-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .hud-dot.live {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
    }

    .hud-controls {
      display: flex;
      align-items: center;
      gap: 2px;
      -webkit-app-region: no-drag;
    }

    .hud-btn {
      width: 20px;
      height: 18px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }
    .hud-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--gold-bright);
    }
    .hud-btn.ok {
      color: var(--green);
    }
    .hud-btn.mic-on {
      color: var(--cyan);
      background: rgba(10, 200, 185, 0.16);
      box-shadow: 0 0 6px rgba(10, 200, 185, 0.35);
    }
    .hud-btn.mic-hearing {
      color: var(--green);
      background: rgba(56, 229, 157, 0.28);
      box-shadow: 0 0 9px rgba(56, 229, 157, 0.65);
    }
    .hud-btn.close:hover {
      background: rgba(255, 78, 80, 0.25);
      color: #ff9b9d;
    }

    /* Compact enemy list */
    .hud-body {
      flex: 1;
      padding: 5px 6px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .hud-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      padding: 2px 4px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .champ-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
    }

    .champ-avatar {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid rgba(200, 170, 110, 0.45);
      object-fit: cover;
      flex-shrink: 0;
      background: #0b1422;
    }

    .role-tag {
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--muted);
      width: 24px;
      text-align: left;
      flex-shrink: 0;
    }

    .spells-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .spell-btn {
      position: relative;
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 5px;
      border: 1px solid rgba(200, 170, 110, 0.42);
      background: #08111e;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.08s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .spell-btn:hover {
      border-color: var(--gold-bright);
      transform: scale(1.06);
    }

    .spell-btn:active {
      transform: scale(0.95);
    }

    .spell-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: filter 0.15s ease, opacity 0.15s ease;
    }

    .spell-btn.on-cd {
      border-color: var(--red);
      box-shadow: 0 0 8px rgba(255, 78, 80, 0.45);
    }

    .spell-btn.on-cd img {
      filter: grayscale(85%) brightness(0.32);
    }

    .spell-btn.just-up {
      border-color: var(--green);
      box-shadow: 0 0 10px rgba(56, 229, 157, 0.7);
    }

    .spell-btn.ult-btn {
      border-color: rgba(168, 85, 247, 0.55);
      background: linear-gradient(145deg, rgba(88, 28, 135, 0.55), rgba(15, 23, 42, 0.92));
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .spell-btn.ult-btn .ult-letter {
      font-size: 11px;
      font-weight: 900;
      color: #e9d5ff;
      letter-spacing: 0.02em;
      transition: opacity 0.15s ease;
    }
    .spell-btn.ult-btn.on-cd {
      border-color: #c084fc;
      background: rgba(30, 14, 52, 0.92);
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
    }
    .spell-btn.ult-btn.on-cd .ult-letter {
      opacity: 0.12;
    }

    .cd-label {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 1px 3px #000, 0 0 4px #000;
      pointer-events: none;
      letter-spacing: -0.02em;
    }

    .cd-label.urgent {
      color: #ffd166;
    }

    .hud-empty {
      text-align: center;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .hud-empty-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--gold-bright);
    }

    .hud-empty-sub {
      font-size: 10px;
      color: var(--muted);
      line-height: 1.3;
    }

    .hud-demo-btn {
      margin-top: 2px;
      padding: 4px 8px;
      border-radius: 5px;
      border: 1px solid rgba(10, 200, 185, 0.45);
      background: rgba(10, 200, 185, 0.14);
      color: var(--cyan);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .hud-demo-btn:hover {
      background: rgba(10, 200, 185, 0.26);
    }

    .hud-shell.collapsed .hud-body {
      display: none;
    }
    .hud-shell.collapsed .hud-bar {
      border-bottom: none;
      height: 28px;
    }
  </style>
</head>
<body>
  <div class="hud-shell" id="hud-shell">
    <div class="hud-bar pywebview-drag-region" id="hud-bar" title="Drag to move HUD">
      <div class="hud-brand">
        <span class="hud-dot" id="hud-dot"></span>
        <span id="hud-title">⚡ NF</span>
      </div>
      <div class="hud-controls">
        <button class="hud-btn" id="btn-mic" title="Voice recognition: say 'Mid no flash', 'Jinx sin flash', 'No flash'">🎤</button>
        <button class="hud-btn" id="btn-copy" title="Copy active CDs for LoL chat">📋</button>
        <button class="hud-btn" id="btn-alpha" title="Toggle opacity">◐</button>
        <button class="hud-btn" id="btn-collapse" title="Collapse / Expand">—</button>
        <button class="hud-btn close" id="btn-close" title="Close HUD">✕</button>
      </div>
    </div>
    <div class="hud-body" id="hud-body">
      <div class="hud-empty">
        <div class="hud-empty-title">Waiting for match…</div>
        <div class="hud-empty-sub">Auto-loads enemies in-game.<br>Left-click = CD · Right-click = Reset</div>
        <button class="hud-demo-btn" id="btn-demo">Preview Demo</button>
      </div>
    </div>
  </div>

  <script>
    let DD_VER = '15.2.1';
    fetch('https://ddragon.leagueoflegends.com/api/versions.json')
      .then(r => r.json())
      .then(v => { if (Array.isArray(v) && v[0]) DD_VER = v[0]; })
      .catch(() => {});

    const CHAMP_FIX = {
      'wukong': 'MonkeyKing', 'jarvaniv': 'JarvanIV', 'jarvan iv': 'JarvanIV',
      'leesin': 'LeeSin', 'lee sin': 'LeeSin', 'masteryi': 'MasterYi', 'master yi': 'MasterYi',
      'missfortune': 'MissFortune', 'miss fortune': 'MissFortune', 'twistedfate': 'TwistedFate',
      'twisted fate': 'TwistedFate', 'tahmkench': 'TahmKench', 'tahm kench': 'TahmKench',
      'xinzhao': 'XinZhao', 'xin zhao': 'XinZhao', 'aurelionsol': 'AurelionSol',
      'aurelion sol': 'AurelionSol', 'drmundo': 'DrMundo', 'dr. mundo': 'DrMundo',
      'kogmaw': 'KogMaw', "kog'maw": 'KogMaw', 'khazix': 'Khazix', "kha'zix": 'Khazix',
      'chogath': 'Chogath', "cho'gath": 'Chogath', 'velkoz': 'Velkoz', "vel'koz": 'Velkoz',
      'kaisa': 'Kaisa', "kai'sa": 'Kaisa', 'reksai': 'RekSai', "rek'sai": 'RekSai',
      'belveth': 'Belveth', "bel'veth": 'Belveth', 'ksante': 'KSante', "k'sante": 'KSante',
      'nunu & willump': 'Nunu', 'renata glasc': 'Renata', 'fiddlesticks': 'Fiddlesticks',
      'leblanc': 'Leblanc', 'mel': 'Mel', 'ambessa': 'Ambessa', 'aurora': 'Aurora',
    };

    function normChamp(name) {
      const low = String(name || '').trim().toLowerCase();
      if (CHAMP_FIX[low]) return CHAMP_FIX[low];
      return String(name || 'Aatrox').replace(/[^A-Za-z0-9]/g, '');
    }

    function champImg(name) {
      return `https://ddragon.leagueoflegends.com/cdn/${DD_VER}/img/champion/${normChamp(name)}.png`;
    }

    function spellImg(ddKey) {
      return `https://ddragon.leagueoflegends.com/cdn/${DD_VER}/img/spell/${ddKey || 'SummonerFlash'}.png`;
    }

    function roleShort(pos, idx) {
      const p = String(pos || '').toUpperCase();
      if (p === 'TOP') return 'TOP';
      if (p === 'JUNGLE' || p === 'JG') return 'JG';
      if (p === 'MIDDLE' || p === 'MID') return 'MID';
      if (p === 'BOTTOM' || p === 'ADC') return 'ADC';
      if (p === 'UTILITY' || p === 'SUP' || p === 'SUPPORT') return 'SUP';
      return ['TOP', 'JG', 'MID', 'ADC', 'SUP'][idx] || 'E' + (idx + 1);
    }

    function spellShort(ddKey, name) {
      const k = String(ddKey || name || '').toLowerCase();
      if (k.includes('flash')) return 'F';
      if (k.includes('teleport')) return 'TP';
      if (k.includes('dot') || k.includes('ignite')) return 'IG';
      if (k.includes('heal')) return 'HEAL';
      if (k.includes('exhaust')) return 'EXH';
      if (k.includes('barrier')) return 'BAR';
      if (k.includes('haste') || k.includes('ghost')) return 'GH';
      if (k.includes('boost') || k.includes('cleanse')) return 'CLN';
      if (k.includes('smite')) return 'SM';
      return 'SP';
    }

    function fmtCd(sec) {
      const s = Math.max(0, Math.ceil(sec));
      if (s >= 60) {
        const m = Math.floor(s / 60);
        const r = s % 60;
        return `${m}:${String(r).padStart(2, '0')}`;
      }
      return `${s}s`;
    }

    function fmtGameClock(sec) {
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}:${String(r).padStart(2, '0')}`;
    }

    // Subtle WebAudio click feedback (zero harsh beeps)
    let _ac = null;
    function softTick(freq = 520) {
      try {
        if (!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
        if (_ac.state === 'suspended') _ac.resume();
        const now = _ac.currentTime;
        const osc = _ac.createOscillator();
        const gain = _ac.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 0.72, now + 0.055);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(_ac.destination);
        osc.start(now);
        osc.stop(now + 0.065);
      } catch {}
    }

    // State
    let enemies = [];
    let isLive = false;
    let demoMode = false;
    let myPosition = '';
    let lastGameTime = 0;
    let lastGameSyncAt = Date.now();
    // key -> { endAt: ms, upAtGameSec: number, role: string, spellCode: string, champ: string }
    const timers = new Map();
    let collapsed = false;
    let titleFlashUntil = 0;
    const OPACITIES = [220, 165, 250];
    let alphaIdx = 0;

    const DEMO_ENEMIES = [
      { champion: 'Darius', position: 'TOP', ult_cooldown: 100, spells: [{ name: 'Flash', dd_key: 'SummonerFlash', cooldown: 300 }, { name: 'Ghost', dd_key: 'SummonerHaste', cooldown: 210 }] },
      { champion: 'LeeSin', position: 'JUNGLE', ult_cooldown: 85, spells: [{ name: 'Flash', dd_key: 'SummonerFlash', cooldown: 300 }, { name: 'Smite', dd_key: 'SummonerSmite', cooldown: 90 }] },
      { champion: 'Ahri', position: 'MIDDLE', ult_cooldown: 115, spells: [{ name: 'Flash', dd_key: 'SummonerFlash', cooldown: 300 }, { name: 'Ignite', dd_key: 'SummonerDot', cooldown: 180 }] },
      { champion: 'Jinx', position: 'BOTTOM', ult_cooldown: 65, spells: [{ name: 'Flash', dd_key: 'SummonerFlash', cooldown: 300 }, { name: 'Barrier', dd_key: 'SummonerBarrier', cooldown: 180 }] },
      { champion: 'Thresh', position: 'UTILITY', ult_cooldown: 120, spells: [{ name: 'Flash', dd_key: 'SummonerFlash', cooldown: 300 }, { name: 'Ignite', dd_key: 'SummonerDot', cooldown: 180 }] },
    ];

    let lastSig = '';
    function renderRows() {
      const body = document.getElementById('hud-body');
      const dot = document.getElementById('hud-dot');
      dot.classList.toggle('live', isLive || demoMode);

      if (!enemies.length) {
        if (lastSig !== 'EMPTY') {
          lastSig = 'EMPTY';
          body.innerHTML = `
            <div class="hud-empty">
              <div class="hud-empty-title">Waiting for match…</div>
              <div class="hud-empty-sub">Auto-loads enemies in-game.<br>Left-click = CD · Right-click = Reset</div>
              <button class="hud-demo-btn" id="btn-demo">Preview Demo</button>
            </div>
          `;
          document.getElementById('btn-demo')?.addEventListener('click', () => {
            demoMode = true;
            enemies = DEMO_ENEMIES;
            myPosition = 'BOTTOM';
            lastGameTime = 360;
            lastGameSyncAt = Date.now();
            renderRows();
          });
        }
        return;
      }

      const sig = enemies.map(e => `${e.champion}:${e.ult_cooldown || 0}:${(e.spells || []).map(s => `${s.dd_key}=${s.cooldown || 0}`).join(',')}`).join('|');
      if (sig === lastSig) return;
      lastSig = sig;

      body.innerHTML = enemies.slice(0, 5).map((en, idx) => {
        const role = roleShort(en.position, idx);
        const sps = (en.spells && en.spells.length ? en.spells : [
          { name: 'Flash', dd_key: 'SummonerFlash', cooldown: 300 },
          { name: 'Ignite', dd_key: 'SummonerDot', cooldown: 180 },
        ]).slice(0, 2);

        const spHtml = sps.map((sp, sIdx) => {
          const key = `${idx}_${sIdx}`;
          return `
            <button class="spell-btn" data-key="${key}" data-idx="${idx}" data-sidx="${sIdx}" data-cd="${sp.cooldown || 300}" data-role="${role}" data-code="${spellShort(sp.dd_key, sp.name)}" data-champ="${en.champion}" title="${en.champion} — ${sp.name} (${sp.cooldown || 300}s)\nLeft-click: Start timer\nRight-click: Reset">
              <img src="${spellImg(sp.dd_key)}" alt="${sp.name}">
              <span class="cd-label" id="cd-${key}"></span>
            </button>
          `;
        }).join('');

        const ultKey = `${idx}_R`;
        const ultCd = en.ult_cooldown || 100;
        const ultHtml = `
          <button class="spell-btn ult-btn" data-key="${ultKey}" data-idx="${idx}" data-sidx="R" data-cd="${ultCd}" data-role="${role}" data-code="R" data-champ="${en.champion}" title="${en.champion} — Ulti R (~${ultCd}s)\nLeft-click or say '${role} no R'\nRight-click: Reset">
            <span class="ult-letter">R</span>
            <span class="cd-label" id="cd-${ultKey}"></span>
          </button>
        `;

        return `
          <div class="hud-row">
            <div class="champ-wrap">
              <img class="champ-avatar" src="${champImg(en.champion)}" alt="${en.champion}" onerror="this.style.opacity='0.3'">
              <span class="role-tag">${role}</span>
            </div>
            <div class="spells-wrap">${spHtml}${ultHtml}</div>
          </div>
        `;
      }).join('');

      body.querySelectorAll('.spell-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const key = btn.dataset.key;
          const cd = parseInt(btn.dataset.cd, 10) || 300;
          const now = Date.now();
          const currentGameSec = lastGameTime + (now - lastGameSyncAt) / 1000;
          timers.set(key, {
            endAt: now + cd * 1000,
            upAtGameSec: currentGameSec + cd,
            role: btn.dataset.role,
            spellCode: btn.dataset.code,
            champ: btn.dataset.champ,
          });
          softTick(540);
          tickTimers();
        });
        btn.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          const key = btn.dataset.key;
          if (timers.has(key)) {
            timers.delete(key);
            btn.classList.remove('on-cd', 'just-up');
            const lbl = document.getElementById(`cd-${key}`);
            if (lbl) lbl.textContent = '';
            softTick(320);
            updateCollapsedTitle();
          }
        });
      });
      tickTimers();
    }

    function triggerSpellByKey(key, playVoiceChime = false) {
      const btn = document.querySelector(`.spell-btn[data-key="${key}"]`);
      if (!btn) return false;
      const cd = parseInt(btn.dataset.cd, 10) || 300;
      const now = Date.now();
      const currentGameSec = lastGameTime + (now - lastGameSyncAt) / 1000;
      timers.set(key, {
        endAt: now + cd * 1000,
        upAtGameSec: currentGameSec + cd,
        role: btn.dataset.role,
        spellCode: btn.dataset.code,
        champ: btn.dataset.champ,
      });
      if (playVoiceChime) {
        softTick(620);
        setTimeout(() => softTick(840), 75);
      } else {
        softTick(540);
      }
      tickTimers();
      return true;
    }

    function flashHudTitle(msg, ms = 1900) {
      const titleEl = document.getElementById('hud-title');
      if (!titleEl) return;
      titleFlashUntil = Date.now() + ms;
      titleEl.textContent = msg;
      setTimeout(() => {
        if (Date.now() >= titleFlashUntil - 50) updateCollapsedTitle();
      }, ms + 30);
    }

    function updateCollapsedTitle() {
      if (Date.now() < titleFlashUntil) return;
      const titleEl = document.getElementById('hud-title');
      if (!titleEl) return;
      const activeCount = timers.size;
      if (collapsed) {
        titleEl.textContent = activeCount > 0 ? `⚡ (${activeCount})` : '⚡ NF';
      } else {
        titleEl.textContent = '⚡ NF';
      }
    }

    function tickTimers() {
      const now = Date.now();
      for (const [key, t] of [...timers.entries()]) {
        const rem = (t.endAt - now) / 1000;
        const btn = document.querySelector(`.spell-btn[data-key="${key}"]`);
        const lbl = document.getElementById(`cd-${key}`);
        if (rem <= 0) {
          timers.delete(key);
          if (btn) {
            btn.classList.remove('on-cd');
            btn.classList.add('just-up');
            setTimeout(() => btn.classList.remove('just-up'), 2200);
          }
          if (lbl) {
            lbl.textContent = '';
            lbl.classList.remove('urgent');
          }
          softTick(740);
        } else {
          if (btn) btn.classList.add('on-cd');
          if (lbl) {
            lbl.textContent = fmtCd(rem);
            lbl.classList.toggle('urgent', rem <= 25);
          }
        }
      }
      updateCollapsedTitle();
    }

    async function pollLive() {
      try {
        const res = await fetch('/api/live-game?lang=en');
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.in_game && Array.isArray(data.enemies) && data.enemies.length) {
          isLive = true;
          demoMode = false;
          enemies = data.enemies;
          myPosition = data.player?.position || data.my_position || '';
          lastGameTime = Number(data.game_time || 0);
          lastGameSyncAt = Date.now();
          renderRows();
        } else if (!demoMode) {
          if (isLive) {
            isLive = false;
            enemies = [];
            timers.clear();
          }
          renderRows();
        }
      } catch {}
    }

    // Header actions
    document.getElementById('btn-copy')?.addEventListener('click', () => {
      const entries = [...timers.values()]
        .filter(t => t.endAt > Date.now())
        .sort((a, b) => a.endAt - b.endAt);
      if (!entries.length) return;
      const text = entries.map(t => `${t.role} ${t.spellCode} ${fmtGameClock(t.upAtGameSec)}`).join(' | ');
      navigator.clipboard?.writeText(text).catch(() => {});
      const btn = document.getElementById('btn-copy');
      btn.textContent = '✓';
      btn.classList.add('ok');
      softTick(660);
      setTimeout(() => {
        btn.textContent = '📋';
        btn.classList.remove('ok');
      }, 1200);
    });

    document.getElementById('btn-alpha')?.addEventListener('click', () => {
      alphaIdx = (alphaIdx + 1) % OPACITIES.length;
      const a = OPACITIES[alphaIdx];
      if (window.pywebview?.api?.set_overlay_opacity) {
        window.pywebview.api.set_overlay_opacity(a);
      } else {
        document.getElementById('hud-shell').style.opacity = (a / 255).toFixed(2);
      }
      softTick(460);
    });

    document.getElementById('btn-collapse')?.addEventListener('click', () => {
      collapsed = !collapsed;
      document.getElementById('hud-shell').classList.toggle('collapsed', collapsed);
      document.getElementById('btn-collapse').textContent = collapsed ? '+' : '—';
      updateCollapsedTitle();
      if (window.pywebview?.api?.set_overlay_height) {
        window.pywebview.api.set_overlay_height(collapsed ? 30 : 218);
      }
      softTick(480);
    });

    // ── Hands-Free Voice Recognition (VAD + 16kHz WAV -> /api/voice-command) ──
    let micActive = false;
    let micStream = null;
    let micCtx = null;
    let micProc = null;
    let voiceSending = false;

    function encodeWav16k(floatChunks, inputRate) {
      let totalLen = 0;
      for (const c of floatChunks) totalLen += c.length;
      const merged = new Float32Array(totalLen);
      let off = 0;
      for (const c of floatChunks) { merged.set(c, off); off += c.length; }

      const targetRate = 16000;
      const ratio = inputRate / targetRate;
      const newLen = Math.max(1, Math.floor(merged.length / ratio));
      const down = new Int16Array(newLen);
      for (let i = 0; i < newLen; i++) {
        const s = Math.max(-1, Math.min(1, merged[Math.floor(i * ratio)] || 0));
        down[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
      }

      const buf = new ArrayBuffer(44 + down.length * 2);
      const view = new DataView(buf);
      const writeStr = (o, str) => { for (let i = 0; i < str.length; i++) view.setUint8(o + i, str.charCodeAt(i)); };
      writeStr(0, 'RIFF');
      view.setUint32(4, 36 + down.length * 2, true);
      writeStr(8, 'WAVE');
      writeStr(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, targetRate, true);
      view.setUint32(28, targetRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeStr(36, 'data');
      view.setUint32(40, down.length * 2, true);
      for (let i = 0; i < down.length; i++) view.setInt16(44 + i * 2, down[i], true);

      const bytes = new Uint8Array(buf);
      let bin = '';
      for (let i = 0; i < bytes.length; i += 0x8000) {
        bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      }
      return btoa(bin);
    }

    async function sendVoiceClip(chunks, sampleRate) {
      if (voiceSending || !enemies.length) return;
      voiceSending = true;
      try {
        const b64 = encodeWav16k(chunks, sampleRate);
        const uiLang = (localStorage.getItem('noflash_lang') || 'es').toLowerCase();
        const recogLang = uiLang === 'en' ? 'en-US' : 'es-AR';
        const res = await fetch('/api/voice-command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            audio_b64: b64,
            lang: recogLang,
            my_position: myPosition,
            enemies: enemies.slice(0, 5),
          }),
        });
        if (!res.ok) return;
        const data = await res.json();
        if (data && data.matched) {
          const list = Array.isArray(data.targets) && data.targets.length
            ? data.targets
            : [{ key: `${data.enemy_idx}_${data.spell_idx}`, spell_dd_key: data.spell_dd_key, spell_name: data.spell_name }];
          const codes = [];
          for (const t of list) {
            if (triggerSpellByKey(t.key, codes.length === 0)) {
              codes.push(t.spell_dd_key === 'ULTI' ? 'R' : spellShort(t.spell_dd_key, t.spell_name));
            }
          }
          if (codes.length) {
            const r = roleShort(data.role, data.enemy_idx);
            flashHudTitle(`✓ ${r} ${codes.join('+')}`, 2300);
          }
        }
      } catch {} finally {
        voiceSending = false;
      }
    }

    async function startVoiceMic() {
      const btn = document.getElementById('btn-mic');
      try {
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
        });
        micCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = micCtx.createMediaStreamSource(micStream);
        micProc = micCtx.createScriptProcessor(4096, 1, 1);

        const preRoll = [];
        let speechBuf = [];
        let speaking = false;
        let silenceMs = 0;
        let speechMs = 0;
        const chunkMs = (4096 / micCtx.sampleRate) * 1000;
        const THRESH = 0.022;

        micProc.onaudioprocess = (ev) => {
          if (!micActive) return;
          const inp = ev.inputBuffer.getChannelData(0);
          let sum = 0;
          for (let i = 0; i < inp.length; i++) sum += inp[i] * inp[i];
          const rms = Math.sqrt(sum / inp.length);
          const copy = new Float32Array(inp);

          if (rms > THRESH) {
            if (!speaking) {
              speaking = true;
              speechMs = 0;
              silenceMs = 0;
              speechBuf = preRoll.slice(-3);
              btn?.classList.add('mic-hearing');
            }
            speechBuf.push(copy);
            speechMs += chunkMs;
            silenceMs = 0;
            if (speechMs >= 2600) {
              const sendCopy = speechBuf;
              speaking = false;
              speechBuf = [];
              btn?.classList.remove('mic-hearing');
              sendVoiceClip(sendCopy, micCtx.sampleRate);
            }
          } else if (speaking) {
            speechBuf.push(copy);
            silenceMs += chunkMs;
            speechMs += chunkMs;
            if (silenceMs >= 550) {
              const sendCopy = speechBuf;
              const dur = speechMs;
              speaking = false;
              speechBuf = [];
              btn?.classList.remove('mic-hearing');
              if (dur >= 320) sendVoiceClip(sendCopy, micCtx.sampleRate);
            }
          } else {
            preRoll.push(copy);
            if (preRoll.length > 4) preRoll.shift();
          }
        };

        src.connect(micProc);
        micProc.connect(micCtx.destination);
        micActive = true;
        btn?.classList.add('mic-on');
        flashHudTitle('🎤 ON', 1300);
        softTick(640);
      } catch (err) {
        flashHudTitle('MIC ERR', 1800);
        stopVoiceMic();
      }
    }

    function stopVoiceMic() {
      micActive = false;
      const btn = document.getElementById('btn-mic');
      btn?.classList.remove('mic-on', 'mic-hearing');
      try { micProc?.disconnect(); } catch {}
      try { micCtx?.close(); } catch {}
      try { micStream?.getTracks().forEach(t => t.stop()); } catch {}
      micProc = null;
      micCtx = null;
      micStream = null;
    }

    document.getElementById('btn-mic')?.addEventListener('click', () => {
      if (micActive) {
        stopVoiceMic();
        flashHudTitle('🎤 OFF', 1100);
        softTick(340);
      } else {
        startVoiceMic();
      }
    });

    document.getElementById('btn-close')?.addEventListener('click', () => {
      if (window.pywebview?.api?.close_overlay) {
        window.pywebview.api.close_overlay();
      } else {
        window.close();
      }
    });

    renderRows();
    pollLive();
    setInterval(pollLive, 3500);
    setInterval(tickTimers, 500);
  </script>
</body>
